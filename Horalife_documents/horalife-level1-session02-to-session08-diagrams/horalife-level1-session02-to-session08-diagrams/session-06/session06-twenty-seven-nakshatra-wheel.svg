  <!-- Minimal sector references -->
  <text x="496.83" y="130.98" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#333333">1</text><text x="613.14" y="332.43" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#333333">9</text><text x="363.69" y="361.59" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#333333">18</text><text x="463.17" y="130.98" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#333333">27</text>

