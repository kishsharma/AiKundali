<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Five Limbs of Panchang</title>
  <desc id="desc">A simple monochrome educational diagram with Panchang at the centre connected to Tithi, Vara, Nakshatra, Yoga and Karana.</desc>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Connecting lines -->
  <g stroke="#8a8a8a" stroke-width="3">
    <line x1="480" y1="270" x2="480" y2="105"/>
    <line x1="480" y1="270" x2="705" y2="180"/>
    <line x1="480" y1="270" x2="650" y2="405"/>
    <line x1="480" y1="270" x2="310" y2="405"/>
    <line x1="480" y1="270" x2="255" y2="180"/>
  </g>

  <!-- Centre -->
  <circle cx="480" cy="270" r="88" fill="#bfbfbf" stroke="#2f2f2f" stroke-width="4"/>
  <text x="480" y="280" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#222222">
    Panchang
  </text>

  <!-- Five limbs -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="480" cy="90" r="62" fill="#e2e2e2" stroke="#3f3f3f" stroke-width="3"/>
    <text x="480" y="98" font-size="24" fill="#222222">Tithi</text>

    <circle cx="735" cy="165" r="62" fill="#d3d3d3" stroke="#3f3f3f" stroke-width="3"/>
    <text x="735" y="173" font-size="24" fill="#222222">Vara</text>

    <circle cx="665" cy="430" r="62" fill="#e2e2e2" stroke="#3f3f3f" stroke-width="3"/>
    <text x="665" y="438" font-size="22" fill="#222222">Nakshatra</text>

    <circle cx="295" cy="430" r="62" fill="#d3d3d3" stroke="#3f3f3f" stroke-width="3"/>
    <text x="295" y="438" font-size="24" fill="#222222">Yoga</text>

    <circle cx="225" cy="165" r="62" fill="#e2e2e2" stroke="#3f3f3f" stroke-width="3"/>
    <text x="225" y="173" font-size="24" fill="#222222">Karana</text>
  </g>

  <!-- Minimal footer -->
  <text x="480" y="515" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Five limbs describe one moment from different angles.
  </text>
</svg>
