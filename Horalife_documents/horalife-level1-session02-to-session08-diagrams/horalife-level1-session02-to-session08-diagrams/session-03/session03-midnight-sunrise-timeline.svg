<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Midnight and Sunrise Timeline</title>
  <desc id="desc">A simple monochrome timeline showing midnight, local sunrise, midday, sunset and the next midnight, with civil and Panchang day references.</desc>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Main timeline -->
  <line x1="110" y1="270" x2="850" y2="270"
        stroke="#3f3f3f" stroke-width="5"/>

  <!-- Civil date band -->
  <rect x="110" y="150" width="740" height="54" rx="10"
        fill="#e3e3e3" stroke="#6a6a6a" stroke-width="2"/>
  <text x="480" y="184" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="22" fill="#222222">
    Civil date: midnight to next midnight
  </text>

  <!-- Panchang day band -->
  <rect x="255" y="336" width="595" height="54" rx="10"
        fill="#c9c9c9" stroke="#555555" stroke-width="2"/>
  <text x="552" y="370" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="22" fill="#222222">
    Traditional day reference: sunrise onward
  </text>

  <!-- Markers -->
  <g stroke="#2f2f2f" stroke-width="3">
    <line x1="110" y1="238" x2="110" y2="302"/>
    <line x1="255" y1="225" x2="255" y2="315"/>
    <line x1="480" y1="238" x2="480" y2="302"/>
    <line x1="690" y1="238" x2="690" y2="302"/>
    <line x1="850" y1="238" x2="850" y2="302"/>
  </g>

  <!-- Highlight sunrise -->
  <circle cx="255" cy="270" r="12" fill="#3f3f3f"/>
  <circle cx="110" cy="270" r="8" fill="#8a8a8a"/>
  <circle cx="480" cy="270" r="8" fill="#8a8a8a"/>
  <circle cx="690" cy="270" r="8" fill="#8a8a8a"/>
  <circle cx="850" cy="270" r="8" fill="#8a8a8a"/>

  <!-- Labels -->
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#222222">
    <text x="110" y="330" font-size="20">Midnight</text>
    <text x="255" y="210" font-size="21" font-weight="600">Local sunrise</text>
    <text x="480" y="330" font-size="20">Midday</text>
    <text x="690" y="330" font-size="20">Sunset</text>
    <text x="850" y="330" font-size="20">Next midnight</text>
  </g>

  <!-- Minimal explanatory note -->
  <text x="480" y="455" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Panchang values are shown with their transition times within the civil date.
  </text>
</svg>
