<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Traditional Planetary Hora Sequence</title>
  <desc id="desc">A simple monochrome seven-step loop showing Saturn, Jupiter, Mars, Sun, Venus, Mercury and Moon in repeating order.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Central label -->
  <circle cx="480" cy="265" r="68"
          fill="#c7c7c7" stroke="#2f2f2f" stroke-width="3"/>
  <text x="480" y="261" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Hora
  </text>
  <text x="480" y="291" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Sequence
  </text>

  <!-- Direction arrows -->
  <line x1="519.6" y1="119.1" x2="564.0" y2="140.4" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><line x1="618.8" y1="205.0" x2="629.7" y2="253.0" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><line x1="613.4" y1="336.1" x2="582.8" y2="374.6" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><line x1="507.6" y1="413.7" x2="458.4" y2="413.7" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><line x1="381.0" y1="379.3" x2="350.3" y2="340.8" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><line x1="328.9" y1="258.8" x2="339.9" y2="210.9" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/><line x1="390.6" y1="143.0" x2="435.0" y2="121.7" stroke="#666666" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Planet nodes -->
  
    <circle cx="480.0" cy="100.0" r="42"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="480.0" y="97.0" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Saturn</text>
    <text x="480.0" y="120.0" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="15" fill="#555555">1</text>
    
    <circle cx="609.0" cy="162.1" r="42"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="609.0" y="159.1" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Jupiter</text>
    <text x="609.0" y="182.1" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="15" fill="#555555">2</text>
    
    <circle cx="640.9" cy="301.7" r="42"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="640.9" y="298.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Mars</text>
    <text x="640.9" y="321.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="15" fill="#555555">3</text>
    
    <circle cx="551.6" cy="413.7" r="42"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="551.6" y="410.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Sun</text>
    <text x="551.6" y="433.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="15" fill="#555555">4</text>
    
    <circle cx="408.4" cy="413.7" r="42"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="408.4" y="410.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Venus</text>
    <text x="408.4" y="433.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="15" fill="#555555">5</text>
    
    <circle cx="319.1" cy="301.7" r="42"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="319.1" y="298.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Mercury</text>
    <text x="319.1" y="321.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="15" fill="#555555">6</text>
    
    <circle cx="351.0" cy="162.1" r="42"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="351.0" y="159.1" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Moon</text>
    <text x="351.0" y="182.1" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="15" fill="#555555">7</text>
    

  <!-- Footer -->
  <text x="480" y="505" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    After Moon, the sequence returns to Saturn and continues.
  </text>
</svg>
