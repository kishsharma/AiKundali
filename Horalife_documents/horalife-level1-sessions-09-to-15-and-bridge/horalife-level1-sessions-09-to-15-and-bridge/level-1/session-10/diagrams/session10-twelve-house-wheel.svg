<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">The Twelve-House Sequence</title>
  <desc id="desc">A simple monochrome twelve-part wheel numbered from the first house to the twelfth house, beginning from Lagna.</desc>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="55" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#222222">
    The Twelve-House Sequence
  </text>

  <circle cx="480" cy="285" r="190"
          fill="#eeeeee" stroke="#3f3f3f" stroke-width="4"/>
  <circle cx="480" cy="285" r="78"
          fill="#ffffff" stroke="#555555" stroke-width="3"/>

  <line x1="480.0" y1="207.0" x2="480.0" y2="95.0" stroke="#444444" stroke-width="2.5"/><line x1="519.0" y1="217.5" x2="575.0" y2="120.5" stroke="#444444" stroke-width="2.5"/><line x1="547.5" y1="246.0" x2="644.5" y2="190.0" stroke="#444444" stroke-width="2.5"/><line x1="558.0" y1="285.0" x2="670.0" y2="285.0" stroke="#444444" stroke-width="2.5"/><line x1="547.5" y1="324.0" x2="644.5" y2="380.0" stroke="#444444" stroke-width="2.5"/><line x1="519.0" y1="352.5" x2="575.0" y2="449.5" stroke="#444444" stroke-width="2.5"/><line x1="480.0" y1="363.0" x2="480.0" y2="475.0" stroke="#444444" stroke-width="2.5"/><line x1="441.0" y1="352.5" x2="385.0" y2="449.5" stroke="#444444" stroke-width="2.5"/><line x1="412.5" y1="324.0" x2="315.5" y2="380.0" stroke="#444444" stroke-width="2.5"/><line x1="402.0" y1="285.0" x2="290.0" y2="285.0" stroke="#444444" stroke-width="2.5"/><line x1="412.5" y1="246.0" x2="315.5" y2="190.0" stroke="#444444" stroke-width="2.5"/><line x1="441.0" y1="217.5" x2="385.0" y2="120.5" stroke="#444444" stroke-width="2.5"/>
  <text x="514.9" y="161.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">1</text><text x="575.5" y="196.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">2</text><text x="610.4" y="257.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">3</text><text x="610.4" y="326.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">4</text><text x="575.5" y="387.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">5</text><text x="514.9" y="422.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">6</text><text x="445.1" y="422.4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">7</text><text x="384.5" y="387.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">8</text><text x="349.6" y="326.9" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">9</text><text x="349.6" y="257.1" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">10</text><text x="384.5" y="196.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">11</text><text x="445.1" y="161.6" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">12</text>

  <text x="480" y="277" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Lagna
  </text>
  <text x="480" y="309" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    House 1 starts here
  </text>

  <!-- Direction arrow -->
  <path d="M675 125 A215 215 0 0 1 765 285"
        fill="none" stroke="#555555" stroke-width="3"/>
  <polygon points="765,285 752,270 775,271" fill="#555555"/>
  <text x="760" y="118" text-anchor="end"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    Continue in order
  </text>

  <text x="480" y="515" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Count the houses from the Ascendant, not automatically from Aries.
  </text>
</svg>
