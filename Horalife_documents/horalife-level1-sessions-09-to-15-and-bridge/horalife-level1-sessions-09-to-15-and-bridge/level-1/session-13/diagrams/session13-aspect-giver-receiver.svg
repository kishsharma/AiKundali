<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Aspect Giver and Receiver</title>
  <desc id="desc">A simple monochrome flow showing the aspecting planet carrying its nature, lordships and condition toward a receiving house or planet.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444444"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>

  <text x="480" y="58" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#222222">
    Aspect Giver and Receiver
  </text>

  <rect x="65" y="175" width="220" height="150" rx="18"
        fill="#eeeeee" stroke="#3f3f3f" stroke-width="3"/>
  <text x="175" y="218" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#222222">
    Aspect giver
  </text>
  <text x="175" y="258" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    Planet casting
  </text>
  <text x="175" y="289" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    the influence
  </text>

  <rect x="360" y="150" width="240" height="200" rx="18"
        fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
  <text x="480" y="193" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    What it carries
  </text>
  <text x="480" y="235" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    Natural nature
  </text>
  <text x="480" y="268" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    Functional lordship
  </text>
  <text x="480" y="301" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    Strength and condition
  </text>

  <rect x="675" y="175" width="220" height="150" rx="18"
        fill="#cccccc" stroke="#3f3f3f" stroke-width="3"/>
  <text x="785" y="218" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="25" font-weight="600" fill="#222222">
    Receiver
  </text>
  <text x="785" y="258" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    House or planet
  </text>
  <text x="785" y="289" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    receiving influence
  </text>

  <line x1="285" y1="250" x2="350" y2="250"
        stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="600" y1="250" x2="665" y2="250"
        stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="175" y="405" width="610" height="88" rx="16"
        fill="#e5e5e5" stroke="#4a4a4a" stroke-width="3"/>
  <text x="480" y="440" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#222222">
    Read both sides before judging
  </text>
  <text x="480" y="472" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    The giver sends the influence; the receiver shows how and where it is expressed.
  </text>

  <text x="480" y="535" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    An aspect is a connection, not an isolated good-or-bad statement.
  </text>
</svg>
