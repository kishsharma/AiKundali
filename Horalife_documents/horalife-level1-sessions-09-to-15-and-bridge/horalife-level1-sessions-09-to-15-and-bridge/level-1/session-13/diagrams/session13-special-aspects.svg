<rect x="200" y="525" width="560" height="58" rx="14" fill="#e5e5e5" stroke="#555" stroke-width="2.5"/>
<text x="480" y="562" text-anchor="middle" font-family="Arial" font-size="21" fill="#333">Count every aspect from the house occupied by the planet.</text>
