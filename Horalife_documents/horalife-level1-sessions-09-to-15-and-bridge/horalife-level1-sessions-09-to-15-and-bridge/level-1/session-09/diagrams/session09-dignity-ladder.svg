<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Planetary Dignity Ladder</title>
  <desc id="desc">A simple monochrome vertical ladder showing exaltation, Moolatrikona, own sign, friendly sign, neutral sign, enemy sign and debilitation.</desc>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="58" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#222222">
    Planetary Dignity Ladder
  </text>

  <!-- Ladder rails -->
  <line x1="320" y1="105" x2="320" y2="455"
        stroke="#444444" stroke-width="5"/>
  <line x1="640" y1="105" x2="640" y2="455"
        stroke="#444444" stroke-width="5"/>

  <!-- Rungs -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="320" y="105" width="320" height="48" fill="#eeeeee" stroke="#444444" stroke-width="2.5"/>
    <text x="480" y="136" font-size="22" font-weight="600" fill="#222222">Exaltation</text>

    <rect x="320" y="155" width="320" height="48" fill="#e4e4e4" stroke="#444444" stroke-width="2.5"/>
    <text x="480" y="186" font-size="22" font-weight="600" fill="#222222">Moolatrikona</text>

    <rect x="320" y="205" width="320" height="48" fill="#dcdcdc" stroke="#444444" stroke-width="2.5"/>
    <text x="480" y="236" font-size="22" font-weight="600" fill="#222222">Own sign</text>

    <rect x="320" y="255" width="320" height="48" fill="#d4d4d4" stroke="#444444" stroke-width="2.5"/>
    <text x="480" y="286" font-size="22" font-weight="600" fill="#222222">Friendly sign</text>

    <rect x="320" y="305" width="320" height="48" fill="#cccccc" stroke="#444444" stroke-width="2.5"/>
    <text x="480" y="336" font-size="22" font-weight="600" fill="#222222">Neutral sign</text>

    <rect x="320" y="355" width="320" height="48" fill="#c4c4c4" stroke="#444444" stroke-width="2.5"/>
    <text x="480" y="386" font-size="22" font-weight="600" fill="#222222">Enemy sign</text>

    <rect x="320" y="405" width="320" height="48" fill="#bbbbbb" stroke="#333333" stroke-width="2.5"/>
    <text x="480" y="436" font-size="22" font-weight="600" fill="#222222">Debilitation</text>
  </g>

  <!-- Side labels -->
  <text x="250" y="145" text-anchor="end"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    More supportive
  </text>
  <line x1="270" y1="155" x2="270" y2="405"
        stroke="#555555" stroke-width="3"/>
  <polygon points="270,120 260,140 280,140" fill="#555555"/>
  <polygon points="270,440 260,420 280,420" fill="#555555"/>
  <text x="250" y="420" text-anchor="end"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    More pressured
  </text>

  <!-- Footer -->
  <text x="480" y="505" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Dignity is a starting point, not the complete planetary verdict.
  </text>
</svg>
