<svg
  width="600"
  height="512"
  viewBox="-62 -55.2 122.2 125.4"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="HoraLife icon">

  <g transform="translate(-1.399,0)">

    <!-- Celestial orbit -->
    <circle
      cx="0"
      cy="0"
      r="48"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="4.304"/>

    <!-- Ascendant / horizon line -->
    <line
      x1="-58"
      y1="-16.380"
      x2="47"
      y2="3.453"
      stroke="#FFFFFF"
      stroke-width="4.5"
      stroke-linecap="round"/>

    <!-- Rising Sun -->
    <circle
      cx="-45.885"
      cy="-14.091"
      r="7"
      fill="#D9A441"
      stroke="#FFF4D6"
      stroke-width="2.2"/>

    <!-- Moon -->
    <circle
      cx="34"
      cy="-16"
      r="4.6"
      fill="#cfd2d8"
      stroke="#F4F6F8"
      stroke-width="0.8"/>

    <!-- Earth -->
    <circle
      cx="47"
      cy="3.453"
      r="15"
      fill="#3F6FA3"
      stroke="#C69A3A"
      stroke-width="3"/>

    <!-- Subtle Earth highlight -->
    <path
      d="M39.5,-2.3
         C42.8,-5.8 48.8,-7.1 53.1,-4.4"
      fill="none"
      stroke="#6F91B4"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.75"/>

  </g>
</svg>