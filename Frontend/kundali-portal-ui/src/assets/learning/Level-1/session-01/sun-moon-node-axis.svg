<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 700"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Ecliptic and Moon Orbit Crossing at Rahu and Ketu</title>
  <desc id="desc">
    A simplified educational diagram showing the Sun's apparent path as a dotted ellipse,
    the Moon's inclined orbit as a second ellipse, Earth at the centre, and Rahu and Ketu
    at the two crossing points.
  </desc>

  <rect width="1000" height="700" fill="white"/>

  <text x="500" y="55"
        font-family="Arial, sans-serif"
        font-size="30"
        fill="#111827"
        text-anchor="middle">Sun's Apparent Path and the Rahu–Ketu Axis</text>

  <!-- Dotted ecliptic ellipse -->
  <ellipse cx="500" cy="350" rx="340" ry="145"
           fill="none"
           stroke="#1f2937"
           stroke-width="4"
           stroke-dasharray="12 10"/>

  <!-- Moon's inclined orbital ellipse -->
  <ellipse cx="500" cy="350" rx="315" ry="110"
           fill="none"
           stroke="#64748b"
           stroke-width="4"
           transform="rotate(-18 500 350)"/>

  <!-- Earth -->
  <circle cx="500" cy="350" r="58"
          fill="#e2e8f0"
          stroke="#1f2937"
          stroke-width="4"/>

  <text x="500" y="359"
        font-family="Arial, sans-serif"
        font-size="25"
        fill="#111827"
        text-anchor="middle">Earth</text>

  <!-- Sun on ecliptic -->
  <circle cx="785" cy="270" r="30"
          fill="#f8fafc"
          stroke="#1f2937"
          stroke-width="4"/>

  <text x="785" y="225"
        font-family="Arial, sans-serif"
        font-size="24"
        fill="#111827"
        text-anchor="middle">Sun</text>

  <!-- Moon on lunar orbit -->
  <circle cx="305" cy="245" r="24"
          fill="#f8fafc"
          stroke="#64748b"
          stroke-width="4"/>

  <text x="305" y="205"
        font-family="Arial, sans-serif"
        font-size="24"
        fill="#111827"
        text-anchor="middle">Moon</text>

  <!-- Approximate nodal crossing points -->
  <circle cx="745" cy="316" r="11"
          fill="white"
          stroke="#111827"
          stroke-width="4"/>

  <circle cx="255" cy="384" r="11"
          fill="white"
          stroke="#111827"
          stroke-width="4"/>

  <!-- Rahu label -->
  <line x1="745" y1="316" x2="810" y2="355"
        stroke="#94a3b8"
        stroke-width="2"/>

  <text x="825" y="362"
        font-family="Arial, sans-serif"
        font-size="25"
        fill="#111827">Rahu</text>

  <text x="825" y="387"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#4b5563">Ascending node</text>

  <!-- Ketu label -->
  <line x1="255" y1="384" x2="190" y2="425"
        stroke="#94a3b8"
        stroke-width="2"/>

  <text x="175" y="432"
        font-family="Arial, sans-serif"
        font-size="25"
        fill="#111827"
        text-anchor="end">Ketu</text>

  <text x="175" y="457"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#4b5563"
        text-anchor="end">Descending node</text>

  <!-- Labels for both paths -->
  <text x="500" y="105"
        font-family="Arial, sans-serif"
        font-size="24"
        fill="#111827"
        text-anchor="middle">Dotted ellipse: Sun's apparent path (Ecliptic)</text>

  <text x="500" y="575"
        font-family="Arial, sans-serif"
        font-size="24"
        fill="#4b5563"
        text-anchor="middle">Solid tilted ellipse: Moon's inclined orbit</text>

  <!-- Direction arrows -->
  <path d="M 690 215 A 340 145 0 0 0 400 205"
        fill="none"
        stroke="#1f2937"
        stroke-width="3"
        stroke-linecap="round"/>
  <polygon points="398,205 418,197 411,218" fill="#1f2937"/>

  <path d="M 365 475 A 315 110 -18 0 0 650 455"
        fill="none"
        stroke="#64748b"
        stroke-width="3"
        stroke-linecap="round"/>
  <polygon points="651,455 631,447 638,468" fill="#64748b"/>

  <!-- Footer -->
  <text x="500" y="630"
        font-family="Arial, sans-serif"
        font-size="21"
        fill="#4b5563"
        text-anchor="middle">Rahu and Ketu are opposite crossing points, about 180° apart</text>

  <text x="500" y="662"
        font-family="Arial, sans-serif"
        font-size="19"
        fill="#64748b"
        text-anchor="middle">They are mathematical nodes, not physical planets</text>
</svg>
