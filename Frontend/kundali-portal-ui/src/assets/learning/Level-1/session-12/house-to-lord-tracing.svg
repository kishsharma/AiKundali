<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">House to Lord Tracing</title>
  <desc id="desc">A simple monochrome flow showing how to trace a selected house to its Rashi, sign lord and the lord's placement in the chart.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444444"/>
    </marker>
  </defs>

  <rect width="960" height="560" fill="#ffffff"/>

  <text x="480" y="58" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#222222">
    House → Rashi → Lord → Placement
  </text>

  <rect x="55" y="180" width="185" height="125" rx="16"
        fill="#eeeeee" stroke="#3f3f3f" stroke-width="3"/>
  <text x="147.5" y="222" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Selected house
  </text>
  <text x="147.5" y="263" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    7th House
  </text>

  <rect x="285" y="180" width="185" height="125" rx="16"
        fill="#e2e2e2" stroke="#3f3f3f" stroke-width="3"/>
  <text x="377.5" y="222" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Rashi
  </text>
  <text x="377.5" y="263" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Capricorn · 10
  </text>

  <rect x="515" y="180" width="185" height="125" rx="16"
        fill="#d6d6d6" stroke="#3f3f3f" stroke-width="3"/>
  <text x="607.5" y="222" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Sign lord
  </text>
  <text x="607.5" y="263" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Saturn
  </text>

  <rect x="745" y="180" width="160" height="125" rx="16"
        fill="#c9c9c9" stroke="#333333" stroke-width="3"/>
  <text x="825" y="222" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Placement
  </text>
  <text x="825" y="263" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    Read Saturn
  </text>

  <line x1="240" y1="242.5" x2="275" y2="242.5"
        stroke="#444444" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="470" y1="242.5" x2="505" y2="242.5"
        stroke="#444444" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="242.5" x2="735" y2="242.5"
        stroke="#444444" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="190" y="370" width="580" height="105" rx="16"
        fill="#e5e5e5" stroke="#4a4a4a" stroke-width="3"/>
  <text x="480" y="408" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#222222">
    Then assess the lord completely
  </text>
  <text x="480" y="444" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#333333">
    House · Sign · Dignity · Conjunctions · Aspects · Dasha
  </text>

  <text x="480" y="520" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Do not judge the selected house without locating and assessing its lord.
  </text>
</svg>
