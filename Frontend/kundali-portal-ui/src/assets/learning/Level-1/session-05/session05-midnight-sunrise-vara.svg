<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Civil Weekday and Traditional Vara</title>
  <desc id="desc">A simple monochrome timeline showing the civil weekday changing at midnight and the traditional Vara changing at local sunrise.</desc>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Main timeline -->
  <line x1="100" y1="270" x2="860" y2="270"
        stroke="#3f3f3f" stroke-width="5"/>

  <!-- Key markers -->
  <line x1="250" y1="205" x2="250" y2="330"
        stroke="#2f2f2f" stroke-width="3"/>
  <line x1="540" y1="190" x2="540" y2="345"
        stroke="#2f2f2f" stroke-width="4"/>

  <circle cx="250" cy="270" r="10" fill="#555555"/>
  <circle cx="540" cy="270" r="12" fill="#2f2f2f"/>

  <!-- Civil weekday band -->
  <rect x="100" y="110" width="150" height="58" rx="10"
        fill="#e6e6e6" stroke="#6a6a6a" stroke-width="2"/>
  <rect x="250" y="110" width="610" height="58" rx="10"
        fill="#d0d0d0" stroke="#6a6a6a" stroke-width="2"/>

  <text x="175" y="147" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#222222">
    Monday
  </text>
  <text x="555" y="147" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#222222">
    Tuesday
  </text>

  <text x="100" y="88"
        font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">
    Civil weekday
  </text>

  <!-- Traditional Vara band -->
  <rect x="100" y="365" width="440" height="58" rx="10"
        fill="#c4c4c4" stroke="#555555" stroke-width="2"/>
  <rect x="540" y="365" width="320" height="58" rx="10"
        fill="#e0e0e0" stroke="#555555" stroke-width="2"/>

  <text x="320" y="402" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#222222">
    Monday Vara
  </text>
  <text x="700" y="402" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#222222">
    Tuesday Vara
  </text>

  <text x="100" y="455"
        font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#222222">
    Traditional Vara
  </text>

  <!-- Labels -->
  <text x="250" y="355" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#222222">
    Midnight
  </text>
  <text x="540" y="175" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" font-weight="600" fill="#222222">
    Local sunrise
  </text>

  <text x="395" y="245" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="19" fill="#555555">
    Pre-sunrise period
  </text>

  <!-- Footer -->
  <text x="480" y="505" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Before sunrise, the civil weekday may have changed while the traditional Vara has not.
  </text>
</svg>
