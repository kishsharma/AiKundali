<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Seven Weekdays and Their Planetary Lords</title>
  <desc id="desc">A simple monochrome circular sequence showing Sunday through Saturday and the traditional planetary lord of each weekday.</desc>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#777777"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Central label -->
  <circle cx="480" cy="270" r="72"
          fill="#c7c7c7" stroke="#2f2f2f" stroke-width="3"/>
  <text x="480" y="265" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Seven-Day
  </text>
  <text x="480" y="295" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Cycle
  </text>

  <!-- Sequence arrows -->
  <line x1="525.0" y1="126.7" x2="559.4" y2="143.3" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/><line x1="620.1" y1="215.9" x2="628.6" y2="253.1" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/><line x1="609.7" y1="345.8" x2="585.9" y2="375.7" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/><line x1="501.6" y1="418.7" x2="463.4" y2="418.7" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/><line x1="377.2" y1="379.6" x2="353.4" y2="349.7" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/><line x1="330.3" y1="258.0" x2="338.8" y2="220.7" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/><line x1="396.0" y1="145.4" x2="430.4" y2="128.9" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Weekday nodes -->
  
    <circle cx="480.0" cy="105.0" r="48"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="480.0" y="99.0" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Sunday</text>
    <text x="480.0" y="123.0" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="16" fill="#555555">Sun</text>
    
    <circle cx="609.0" cy="167.1" r="48"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="609.0" y="161.1" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Monday</text>
    <text x="609.0" y="185.1" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="16" fill="#555555">Moon</text>
    
    <circle cx="640.9" cy="306.7" r="48"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="640.9" y="300.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Tuesday</text>
    <text x="640.9" y="324.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="16" fill="#555555">Mars</text>
    
    <circle cx="551.6" cy="418.7" r="48"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="551.6" y="412.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Wednesday</text>
    <text x="551.6" y="436.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="16" fill="#555555">Mercury</text>
    
    <circle cx="408.4" cy="418.7" r="48"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="408.4" y="412.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Thursday</text>
    <text x="408.4" y="436.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="16" fill="#555555">Jupiter</text>
    
    <circle cx="319.1" cy="306.7" r="48"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="319.1" y="300.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Friday</text>
    <text x="319.1" y="324.7" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="16" fill="#555555">Venus</text>
    
    <circle cx="351.0" cy="167.1" r="48"
            fill="#dddddd" stroke="#3f3f3f" stroke-width="3"/>
    <text x="351.0" y="161.1" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#222222">Saturday</text>
    <text x="351.0" y="185.1" text-anchor="middle"
          font-family="Arial, sans-serif" font-size="16" fill="#555555">Saturn</text>
    

  <text x="480" y="512" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Each weekday is associated with one traditional planetary lord.
  </text>
</svg>
