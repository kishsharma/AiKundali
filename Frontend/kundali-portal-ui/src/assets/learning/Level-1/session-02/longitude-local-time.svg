<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Longitude and Local Solar Time</title>
  <desc id="desc">A simple monochrome educational diagram showing two locations on Earth at different longitudes and their different local solar times.</desc>

  <defs>
    <clipPath id="earthClip">
      <circle cx="480" cy="265" r="170"/>
    </clipPath>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Sun -->
  <circle cx="105" cy="265" r="48" fill="#d9d9d9" stroke="#2f2f2f" stroke-width="3"/>
  <text x="105" y="335" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#222222">Sun</text>

  <!-- Sunlight -->
  <g stroke="#8a8a8a" stroke-width="4">
    <line x1="165" y1="205" x2="285" y2="205"/>
    <line x1="165" y1="265" x2="285" y2="265"/>
    <line x1="165" y1="325" x2="285" y2="325"/>
  </g>
  <text x="225" y="180" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="18" fill="#555555">Sunlight</text>

  <!-- Earth -->
  <circle cx="480" cy="265" r="170" fill="#f2f2f2" stroke="#2f2f2f" stroke-width="3"/>

  <!-- Night side -->
  <rect x="480" y="95" width="170" height="340" fill="#c2c2c2" clip-path="url(#earthClip)"/>

  <!-- Latitude guides -->
  <g fill="none" stroke="#b0b0b0" stroke-width="2">
    <ellipse cx="480" cy="265" rx="170" ry="55"/>
    <ellipse cx="480" cy="210" rx="150" ry="38"/>
    <ellipse cx="480" cy="320" rx="150" ry="38"/>
  </g>

  <!-- Longitude meridians -->
  <g fill="none" stroke="#6f6f6f" stroke-width="2">
    <ellipse cx="480" cy="265" rx="62" ry="170"/>
    <ellipse cx="480" cy="265" rx="118" ry="170"/>
    <line x1="480" y1="95" x2="480" y2="435"/>
  </g>

  <!-- Local meridian highlight -->
  <ellipse cx="480" cy="265" rx="118" ry="170"
           fill="none" stroke="#2f2f2f" stroke-width="4"/>

  <!-- Locations -->
  <circle cx="385" cy="223" r="7" fill="#3f3f3f"/>
  <circle cx="570" cy="240" r="7" fill="#3f3f3f"/>

  <line x1="385" y1="223" x2="320" y2="165" stroke="#555555" stroke-width="2"/>
  <line x1="570" y1="240" x2="650" y2="175" stroke="#555555" stroke-width="2"/>

  <text x="305" y="155" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="19" fill="#222222">Western location</text>
  <text x="675" y="165" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="19" fill="#222222">Eastern location</text>

  <!-- Time labels -->
  <text x="300" y="195" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#555555">Earlier morning</text>
  <text x="680" y="205" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#555555">Later local time</text>

  <!-- Meridian label -->
  <text x="705" y="355"
        font-family="Arial, sans-serif" font-size="18" fill="#333333">Local meridian</text>
  <line x1="690" y1="345" x2="600" y2="320" stroke="#555555" stroke-width="2"/>

  <!-- Core principle -->
  <text x="480" y="495" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="22" fill="#222222">
    Places farther east experience local noon earlier.
  </text>
</svg>
