<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sidereal and Synodic Lunar Month</title>
  <desc id="desc">A simple monochrome two-stage diagram showing the Moon returning relative to the stars before reaching the next New Moon alignment with the Sun.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3f3f3f"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Divider -->
  <line x1="480" y1="55" x2="480" y2="485" stroke="#b0b0b0" stroke-width="2"/>

  <!-- Stage 1 -->
  <text x="240" y="48" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#2f2f2f">
    Return relative to stars
  </text>

  <!-- Distant star reference -->
  <g fill="#7a7a7a">
    <circle cx="95" cy="120" r="4"/>
    <circle cx="130" cy="88" r="4"/>
    <circle cx="165" cy="125" r="4"/>
    <circle cx="205" cy="92" r="4"/>
  </g>
  <line x1="150" y1="100" x2="150" y2="395" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="150" y="420" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#555555">Star direction</text>

  <!-- Earth and orbit -->
  <circle cx="280" cy="270" r="48" fill="#bfbfbf" stroke="#2f2f2f" stroke-width="3"/>
  <circle cx="280" cy="270" r="120" fill="none" stroke="#a5a5a5" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="160" cy="270" r="22" fill="#d9d9d9" stroke="#2f2f2f" stroke-width="2"/>
  <path d="M200 175 C265 125, 350 150, 390 215"
        fill="none" stroke="#3f3f3f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="280" y="278" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="20" fill="#222222">Earth</text>
  <text x="160" y="238" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#222222">Moon</text>
  <text x="240" y="470" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="19" fill="#333333">
    Sidereal period ≈ 27.3 days
  </text>

  <!-- Stage 2 -->
  <text x="720" y="48" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#2f2f2f">
    Return to the same phase
  </text>

  <!-- Sun -->
  <circle cx="555" cy="270" r="42" fill="#d9d9d9" stroke="#2f2f2f" stroke-width="3"/>
  <text x="555" y="335" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="19" fill="#222222">Sun</text>

  <!-- Initial Earth position -->
  <circle cx="700" cy="270" r="42" fill="#bfbfbf" stroke="#2f2f2f" stroke-width="3"/>
  <circle cx="655" cy="270" r="19" fill="#3f3f3f" stroke="#2f2f2f" stroke-width="2"/>

  <!-- Advanced Earth position -->
  <circle cx="790" cy="205" r="42" fill="#bfbfbf" stroke="#2f2f2f" stroke-width="3"/>
  <circle cx="748" cy="185" r="19" fill="#3f3f3f" stroke="#2f2f2f" stroke-width="2"/>

  <!-- Earth orbit movement -->
  <path d="M700 315 C735 338, 790 320, 820 270"
        fill="none" stroke="#777777" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="790" y="352" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#555555">Earth advances</text>

  <!-- Extra moon travel -->
  <path d="M735 145 C790 115, 850 145, 865 200"
        fill="none" stroke="#3f3f3f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="815" y="112" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="17" fill="#555555">Additional Moon motion</text>

  <!-- Alignment guides -->
  <line x1="595" y1="270" x2="655" y2="270" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="590" y1="245" x2="748" y2="185" stroke="#8a8a8a" stroke-width="2" stroke-dasharray="6 6"/>

  <text x="720" y="470" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="19" fill="#333333">
    Synodic month ≈ 29.5 days
  </text>
</svg>
