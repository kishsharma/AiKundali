size="18" fill="#222222">{i+1}</text><text x="642.50" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222">{i+1}</text><text x="707.50" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222">{i+1}</text><text x="772.50" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222">{i+1}</text><text x="837.50" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222222">{i+1}</text>
  <text x="890" y="244"
        font-family="Arial, sans-serif" font-size="18" fill="#555555">
    30° each
  </text>

  <!-- Nakshatra label -->
  <text x="90" y="350"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    27 Nakshatras
  </text>

  <!-- Nakshatra band -->
  <rect x="90" y="375" width="780" height="90"
        fill="#d0d0d0" stroke="#3f3f3f" stroke-width="3"/>
<line x1="90.00" y1="375" x2="90.00" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="118.89" y1="375" x2="118.89" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="147.78" y1="375" x2="147.78" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="176.67" y1="375" x2="176.67" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="205.56" y1="375" x2="205.56" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="234.44" y1="375" x2="234.44" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="263.33" y1="375" x2="263.33" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="292.22" y1="375" x2="292.22" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="321.11" y1="375" x2="321.11" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="350.00" y1="375" x2="350.00" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="378.89" y1="375" x2="378.89" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="407.78" y1="375" x2="407.78" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="436.67" y1="375" x2="436.67" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="465.56" y1="375" x2="465.56" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="494.44" y1="375" x2="494.44" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="523.33" y1="375" x2="523.33" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="552.22" y1="375" x2="552.22" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="581.11" y1="375" x2="581.11" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="610.00" y1="375" x2="610.00" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="638.89" y1="375" x2="638.89" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="667.78" y1="375" x2="667.78" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="696.67" y1="375" x2="696.67" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="725.56" y1="375" x2="725.56" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="754.44" y1="375" x2="754.44" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="783.33" y1="375" x2="783.33" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="812.22" y1="375" x2="812.22" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="841.11" y1="375" x2="841.11" y2="465" stroke="#777777" stroke-width="1.5"/><line x1="870.00" y1="375" x2="870.00" y2="465" stroke="#777777" stroke-width="1.5"/><text x="104.44" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222222">{i+1}</text><text x="335.56" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222222">{i+1}</text><text x="595.56" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222222">{i+1}</text><text x="855.56" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222222">{i+1}</text>
  <text x="890" y="429"
        font-family="Arial, sans-serif" font-size="18" fill="#555555">
    13°20′ each
  </text>

  <!-- Minimal note -->
  <text x="480" y="510" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="21" fill="#333333">
    Rashi and Nakshatra are different divisions placed over the same zodiac.
  </text>
</svg>
