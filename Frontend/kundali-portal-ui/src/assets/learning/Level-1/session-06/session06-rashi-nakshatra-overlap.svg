<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Rashi and Nakshatra Grids</title>
  <desc id="desc">Two aligned monochrome horizontal scales showing twelve equal Rashis and twenty-seven equal Nakshatras across the same 360 degree zodiac.</desc>

  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Shared zodiac span -->
  <line x1="90" y1="95" x2="870" y2="95"
        stroke="#3f3f3f" stroke-width="3"/>
  <line x1="90" y1="82" x2="90" y2="108"
        stroke="#3f3f3f" stroke-width="3"/>
  <line x1="870" y1="82" x2="870" y2="108"
        stroke="#3f3f3f" stroke-width="3"/>

  <text x="480" y="68" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    Same 360° Zodiac
  </text>

  <!-- Rashi label -->
  <text x="90" y="165"
        font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">
    12 Rashis
  </text>

  <!-- Rashi band -->
  <rect x="90" y="190" width="780" height="90"
        fill="#e2e2e2" stroke="#3f3f3f" stroke-width="3"/>
