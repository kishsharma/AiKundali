  </text>

  <line x1="235" y1="190" x2="275" y2="190" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="475" y1="190" x2="515" y2="190" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="715" y1="190" x2="755" y2="190" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="955" y1="190" x2="995" y2="190" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Downward transition -->
  <line x1="1100" y1="245" x2="1100" y2="315" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="880" y="330" width="220" height="105" rx="16"
