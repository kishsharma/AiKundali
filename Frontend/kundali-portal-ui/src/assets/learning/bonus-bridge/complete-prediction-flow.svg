  </text>

  <line x1="880" y1="382" x2="840" y2="382" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="610" y1="382" x2="570" y2="382" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="340" y1="382" x2="300" y2="382" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Final narrative -->
  <line x1="180" y1="435" x2="180" y2="485" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="300" y="485" width="720" height="85" rx="18"
