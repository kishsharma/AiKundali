  </text>

  <rect x="285" y="135" width="190" height="110" rx="16"
        fill="#e6e6e6" stroke="#444444" stroke-width="3"/>
  <text x="380" y="180" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#222222">
    Mahadasha
  </text>
  <text x="380" y="213" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="18" fill="#333333">
