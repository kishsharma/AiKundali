<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 620" role="img" aria-labelledby="title desc">
  <title id="title">Complete Kundali Prediction Flow</title>
  <desc id="desc">A monochrome left-to-right flow from natal promise through Dasha, Gochar, evidence, verdict, confidence and layman narrative.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444444"/>
    </marker>
  </defs>

  <rect width="1320" height="620" fill="#ffffff"/>

  <text x="660" y="58" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#222222">
