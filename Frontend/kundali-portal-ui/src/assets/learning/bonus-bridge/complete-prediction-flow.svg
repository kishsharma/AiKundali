  </text>

  <rect x="525" y="135" width="190" height="110" rx="16"
        fill="#dddddd" stroke="#444444" stroke-width="3"/>
  <text x="620" y="180" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#222222">
    Antardasha
  </text>
  <text x="620" y="213" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="18" fill="#333333">
    Active subtheme
  </text>

  <rect x="765" y="135" width="190" height="110" rx="16"
        fill="#d5d5d5" stroke="#444444" stroke-width="3"/>
  <text x="860" y="180" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="23" font-weight="600" fill="#222222">
