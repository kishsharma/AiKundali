  <line x1="180" y1="485" x2="290" y2="527" stroke="#444444" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="660" y="603" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="19" fill="#333333">
