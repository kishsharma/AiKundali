<div class="confirm-backdrop" *ngIf="confirmDialog.current() as request" (click)="cancel()">
  <section
    class="confirm-dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="confirm-dialog-title"
    aria-describedby="confirm-dialog-message"
    (click)="$event.stopPropagation()">
    <h2 id="confirm-dialog-title">{{ request.title }}</h2>
    <p id="confirm-dialog-message">{{ request.message }}</p>
    <div class="confirm-actions">
      <button #cancelButton type="button" class="cancel" (click)="cancel()">{{ request.cancelLabel }}</button>
      <button type="button" class="confirm" [class.danger]="request.tone === 'danger'" (click)="accept()">{{ request.confirmLabel }}</button>
    </div>
  </section>
</div>
