<div class="sketch-overlay" aria-label="Sketch overlay">
  <div class="sketch-surface" [class.drawing-active]="selectedTool !== toolType.Select && selectedTool !== toolType.Hand">
    <ng-whiteboard
      [boardId]="boardId"
      [config]="whiteboardConfig"
      [selectedTool]="selectedTool"
      (ready)="onBoardReady()"
      (dataChange)="onDataChange($event)"
      (selectedToolChange)="selectedTool = $event">
    </ng-whiteboard>
  </div>

  <aside class="sketch-toolbar" role="toolbar" aria-label="Sketch tools">
    <div class="tool-group" role="group" aria-label="Drawing tools">
      <button type="button" class="tool-button" [class.active]="selectedTool === toolType.Pen" aria-label="Pen" title="Pen" (click)="setTool(toolType.Pen)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3.8a1.6 1.6 0 0 1 2.3 0l2.7 2.7a1.6 1.6 0 0 1 0 2.3L10.1 18.9 5 20l1.1-5.1z"></path><path d="m13.8 5.2 5 5"></path></svg>
      </button>
      <button type="button" class="tool-button" [class.active]="selectedTool === toolType.Eraser" aria-label="Eraser" title="Eraser" (click)="setTool(toolType.Eraser)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.3 4.9-9.7 9.7a1.8 1.8 0 0 0 0 2.5L7.8 20h7.4l4.2-4.2a1.8 1.8 0 0 0 0-2.5l-7.4-7.4a1.8 1.8 0 0 0-2.5 0Z"></path><path d="m8.5 10.7 5.7 5.7M5 20h14"></path></svg>
      </button>
      <button type="button" class="tool-button" [class.active]="selectedTool === toolType.Line" aria-label="Line" title="Line" (click)="setTool(toolType.Line)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5"></path></svg>
      </button>
      <button type="button" class="tool-button" [class.active]="selectedTool === toolType.Ellipse" aria-label="Ellipse" title="Ellipse" (click)="setTool(toolType.Ellipse)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="8" ry="6"></ellipse></svg>
      </button>
      <button type="button" class="tool-button" [class.active]="selectedTool === toolType.Rectangle" aria-label="Rectangle" title="Rectangle" (click)="setTool(toolType.Rectangle)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="14" height="12" rx="1.5"></rect></svg>
      </button>
      <button type="button" class="tool-button" [class.active]="selectedTool === toolType.Select" aria-label="Select" title="Select" (click)="setTool(toolType.Select)">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="filled"><path d="M5 3.5 5 18.8l4.1-3.2 2.1 5 2.3-.9-2.1-5H18.5z"></path></svg>
      </button>
    </div>

    <div class="tool-group color-group" role="group" aria-label="Pen color">
      <button *ngFor="let color of colorPresets" type="button" class="color-swatch" [class.active]="strokeColor === color" [style.--swatch]="color" [attr.aria-label]="'Color ' + color" [title]="color" (click)="setStrokeColor(color)"></button>
      <label class="width-control" title="Stroke width">
        <span aria-hidden="true">↔</span>
        <input type="range" min="1" max="12" step="1" [value]="strokeWidth" aria-label="Stroke width" (input)="setStrokeWidth($any($event.target).value)" />
      </label>
    </div>

    <div class="tool-group" role="group" aria-label="Zoom controls">
      <button type="button" class="tool-button" aria-label="Zoom out" title="Zoom out" [disabled]="zoomPercent <= 50" (click)="zoomOut()"><span aria-hidden="true">−</span></button>
      <button type="button" class="tool-button zoom-label" aria-label="Reset zoom" title="Reset zoom" (click)="resetZoom()">{{ zoomPercent }}%</button>
      <button type="button" class="tool-button" aria-label="Zoom in" title="Zoom in" [disabled]="zoomPercent >= 125" (click)="zoomIn()"><span aria-hidden="true">+</span></button>
    </div>

    <div class="tool-group" role="group" aria-label="Board actions">
      <button type="button" class="tool-button" aria-label="Undo" title="Undo" (click)="undo()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 5 11l4 4M5 11h9a5 5 0 0 1 0 10h-2"></path></svg></button>
      <button type="button" class="tool-button" aria-label="Redo" title="Redo" (click)="redo()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 4 4-4 4M19 11h-9a5 5 0 0 0 0 10h2"></path></svg></button>
      <button type="button" class="tool-button danger" aria-label="Clear drawing" title="Clear drawing" [disabled]="!hasStrokes" (click)="clearBoard()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V5.8A1.8 1.8 0 0 1 10.8 4h2.4A1.8 1.8 0 0 1 15 5.8V7l1.5 12.2A1.8 1.8 0 0 1 14.7 21h-5.4a1.8 1.8 0 0 1-1.8-1.8z"></path></svg></button>
      <button type="button" class="tool-button" aria-label="Download sketch as PNG" title="Download sketch as PNG" [disabled]="!hasStrokes" (click)="downloadPng()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v10m-4-4 4 4 4-4M5 18h14"></path></svg></button>
    </div>
  </aside>
</div>
