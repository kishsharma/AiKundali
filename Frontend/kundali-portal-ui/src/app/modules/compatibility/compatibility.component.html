<app-page-header
  title="Compatibility Analysis"
  subtitle="Check relationship compatibility"
  description="Select two Kundali charts to analyze their astrological compatibility based on Gun Milan and other factors."
  [breadcrumbs]="[
    { label: 'Home', routerLink: '/' },
    { label: 'Compatibility', active: true }
  ]"
></app-page-header>

<div class="compatibility-layout">
  <!-- Compatibility Analyzer -->
  <app-section-card title="Analyze Compatibility" [interactive]="false">
    <div class="coming-soon">
      <p>💑 Compatibility analysis form coming soon!</p>
      <p class="subtitle">Select two charts to view detailed compatibility scores.</p>
    </div>
  </app-section-card>

  <!-- Compatibility History -->
  <app-section-card title="Analysis History" [interactive]="false">
    <div class="coming-soon">
      <p>📋 Previous compatibility analyses will appear here.</p>
      <p class="subtitle">View and track your past compatibility reports.</p>
    </div>
  </app-section-card>
</div>
