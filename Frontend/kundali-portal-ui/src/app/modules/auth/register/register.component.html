<div class="auth-page">
  <div class="auth-card">
    <h1>Create your HoraLife account</h1>
    <p>Verify your email first, then complete your profile.</p>

    <ng-container [ngSwitch]="step">
      <ng-container *ngSwitchCase="'email'">
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
          />
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="button" (click)="sendRegistrationCode()" [disabled]="isLoading">
          {{ isLoading ? 'Sending code...' : 'Send Verification Code' }}
        </button>
      </ng-container>

      <ng-container *ngSwitchCase="'code'">
        <div class="otp-context">
          Code sent to <strong>{{ maskedDestination }}</strong>
          <button type="button" class="text-button" (click)="editEmail()" [disabled]="isLoading">Change</button>
        </div>

        <div class="form-group">
          <label>Verification code</label>
          <input
            type="text"
            inputmode="numeric"
            maxlength="6"
            [(ngModel)]="otpCode"
            placeholder="Enter 6 digit code"
            autocomplete="one-time-code"
          />
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="button" (click)="verifyRegistrationCode()" [disabled]="isLoading">
          {{ isLoading ? 'Verifying...' : 'Verify Email' }}
        </button>

        <button type="button" class="secondary-button" (click)="sendRegistrationCode()" [disabled]="isLoading || resendSeconds > 0">
          {{ resendSeconds > 0 ? 'Resend in ' + resendSeconds + 's' : 'Resend Code' }}
        </button>
      </ng-container>

      <ng-container *ngSwitchCase="'profile'">
        <div class="verified-note">
          Email verified: <strong>{{ email }}</strong>
        </div>

        <div class="form-group">
          <label>Full name</label>
          <input
            type="text"
            [(ngModel)]="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label>Phone number</label>
          <input
            type="tel"
            [(ngModel)]="phoneNumber"
            placeholder="Optional"
            autocomplete="tel"
          />
        </div>

        <div class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>

        <button type="button" (click)="completeRegistration()" [disabled]="isLoading">
          {{ isLoading ? 'Creating account...' : 'Complete Account' }}
        </button>
      </ng-container>
    </ng-container>

    <div class="auth-switch">
      Already have an account?
      <a routerLink="/login">Login</a>
    </div>
  </div>
</div>
