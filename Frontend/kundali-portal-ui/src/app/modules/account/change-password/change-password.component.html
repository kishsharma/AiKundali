<section class="change-password-page">
  <app-page-header
    title="Change Password"
    subtitle="Update the password used for your KundaliScore account"
    [breadcrumbs]="[
      { label: 'Home', routerLink: '/' },
      { label: 'Change Password', active: true }
    ]">
  </app-page-header>

  <div class="password-shell">
    <form class="password-card" [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <div class="card-heading">
        <h2>Account Security</h2>
        <p>Use a password that is hard to guess and not reused elsewhere.</p>
      </div>

      <label class="form-field">
        <span>Current password</span>
        <input type="password" formControlName="currentPassword" autocomplete="current-password" />
        <small *ngIf="passwordForm.controls.currentPassword.touched && passwordForm.controls.currentPassword.invalid">
          Current password is required.
        </small>
      </label>

      <label class="form-field">
        <span>New password</span>
        <input type="password" formControlName="newPassword" autocomplete="new-password" />
        <small *ngIf="passwordForm.controls.newPassword.touched && passwordForm.controls.newPassword.hasError('required')">
          New password is required.
        </small>
        <small *ngIf="passwordForm.controls.newPassword.touched && passwordForm.controls.newPassword.hasError('minlength')">
          New password must be at least 6 characters.
        </small>
      </label>

      <label class="form-field">
        <span>Confirm new password</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
        <small *ngIf="passwordForm.controls.confirmPassword.touched && passwordForm.controls.confirmPassword.hasError('required')">
          Please confirm your new password.
        </small>
        <small *ngIf="hasPasswordMismatch">
          New password and confirmation do not match.
        </small>
      </label>

      <div class="actions">
        <a routerLink="/app/dashboard" class="secondary-btn">Cancel</a>
        <button type="submit" class="primary-btn" [disabled]="saving">
          {{ saving ? 'Updating...' : 'Update Password' }}
        </button>
      </div>
    </form>
  </div>
</section>
