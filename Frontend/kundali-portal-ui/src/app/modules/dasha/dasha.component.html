<app-page-header
  [title]="'dasha.title' | transloco"
  [subtitle]="'dasha.subtitle' | transloco"
  [description]="'dasha.description' | transloco"
></app-page-header>

<div class="dasha-layout">
  <!-- Select Kundali -->
  <app-section-card [title]="'dasha.selectChartTitle' | transloco" [interactive]="false">
    <div class="coming-soon">
      <p>{{ 'dasha.selectChartComingSoon' | transloco }}</p>
      <p class="subtitle">{{ 'dasha.selectChartSubtitle' | transloco }}</p>
    </div>
  </app-section-card>

  <!-- Current & Future Dashas -->
  <app-section-card [title]="'dasha.timelineTitle' | transloco" [interactive]="false">
    <div class="coming-soon">
      <p>{{ 'dasha.timelineComingSoon' | transloco }}</p>
      <p class="subtitle">{{ 'dasha.timelineSubtitle' | transloco }}</p>
    </div>
  </app-section-card>

  <!-- Dasha Predictions -->
  <app-section-card [title]="'dasha.predictionsTitle' | transloco" [interactive]="false">
    <div class="coming-soon">
      <p>{{ 'dasha.predictionsComingSoon' | transloco }}</p>
      <p class="subtitle">{{ 'dasha.predictionsSubtitle' | transloco }}</p>
    </div>
  </app-section-card>
</div>
