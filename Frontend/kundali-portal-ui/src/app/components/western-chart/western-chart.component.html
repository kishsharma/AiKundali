<div class="western-chart-wrapper">
  <svg
    viewBox="35 35 430 430"
    width="100%"
    preserveAspectRatio="xMidYMid meet"
    class="western-svg"
    [attr.aria-label]="'chart.westernAriaLabel' | transloco"
  >
    <circle cx="250" cy="250" r="210" class="outer-ring" />
    <circle cx="250" cy="250" r="72" class="inner-ring" />

    <g *ngFor="let segment of segments">
      <path
        [attr.d]="segment.path"
        class="wheel-segment"
        [class.active]="hoveredHouse === getHouseForSign(segment.sign)"
        [class.selected]="selectedHouse === getHouseForSign(segment.sign)"
        (mouseenter)="hoverHouse(getHouseForSign(segment.sign))"
        (mouseleave)="leaveHouse()"
        (click)="selectHouse(getHouseForSign(segment.sign))"
      />

      <text
        [attr.x]="segment.labelX"
        [attr.y]="segment.labelY"
        class="sign-label"
        text-anchor="middle"
      >
        {{ segment.sign }} {{ segment.label }}
      </text>

      <text
        [attr.x]="segment.houseX"
        [attr.y]="segment.houseY"
        class="house-label"
        text-anchor="middle"
      >
        H{{ getHouseForSign(segment.sign) }}
      </text>

      <text
        [attr.x]="segment.planetX"
        [attr.y]="segment.planetY"
        class="planet-text"
        text-anchor="middle"
      >
        <tspan
          *ngFor="let planet of getPlanets(segment.sign); let planetIndex = index"
          [attr.x]="segment.planetX"
          [attr.dy]="planetIndex === 0 ? 0 : (showDegrees ? 16 : 13)"
          [ngClass]="getPlanetToneClass(planet)">
          <title>{{ getPlanetTooltip(planet) }}</title>
          {{ getPlanetShortName(planet) }}<tspan
            *ngIf="showDegrees && getPlanetDegreeLabel(planet)"
            class="planet-degree"
          > {{ getPlanetDegreeLabel(planet) }}°</tspan>
        </tspan>
      </text>
    </g>

    <text x="250" y="238" text-anchor="middle" class="center-title">{{ 'chartTypes.western' | transloco }}</text>
    <text x="250" y="262" text-anchor="middle" class="center-subtitle">{{ 'chart.rashiWheel' | transloco }}</text>
  </svg>
</div>
