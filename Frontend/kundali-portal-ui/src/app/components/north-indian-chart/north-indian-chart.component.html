<!-- kundali-chart.component.html -->
<div class="chart-wrapper">

  <svg
    viewBox="35 35 430 430"
    preserveAspectRatio="xMidYMid meet"
    class="kundali-svg"
  >

    <!-- Chart -->


<!-- OUTER SQUARE -->
<rect
  x="40"
  y="40"
  width="420"
  height="420"
  rx="2"
  ry="2"
  class="chart-outline"
/>

<!-- MAIN OUTER DIAMOND -->
<polygon
  points="250,40 460,250 250,460 40,250"
  class="chart-secondary-outline chart-muted-line"
/>

<!-- CENTER DIAMOND -->
<path
  d="M 250 182 Q 250 180 252 182 L 318 248 Q 320 250 318 252 L 252 318 Q 250 320 248 318 L 182 252 Q 180 250 182 248 L 248 182 Q 250 180 250 182 Z"
  class="chart-inner-diamond"
/>

<!-- MAIN CROSS -->
<line
  x1="250"
  y1="40"
  x2="250"
  y2="460"
  class="chart-line chart-axis-line"
/>

<line
  x1="40"
  y1="250"
  x2="460"
  y2="250"
  class="chart-line chart-axis-line"
/>

<!-- TOP LEFT DIAGONAL -->
<line
  x1="145"
  y1="145"
  x2="41"
  y2="41"
  class="chart-line chart-muted-line"
/>

<!-- TOP RIGHT DIAGONAL -->
<line
  x1="355"
  y1="145"
  x2="459"
  y2="41"
  class="chart-line chart-muted-line"
/>

<!-- BOTTOM RIGHT DIAGONAL -->
<line
  x1="355"
  y1="355"
  x2="459"
  y2="459"
  class="chart-line chart-muted-line"
/>

<!-- BOTTOM LEFT DIAGONAL -->
<line
  x1="145"
  y1="355"
  x2="41"
  y2="459"
  class="chart-line chart-muted-line"
/>

<!-- INNER CONNECTIONS -->

<line
  x1="145"
  y1="145"
  x2="250"
  y2="40"
  class="chart-line chart-muted-line"
/>

<line
  x1="355"
  y1="145"

  y2="40"
  class="chart-line chart-muted-line"
/>

<line
  x1="355"

  y2="250"
  class="chart-line chart-muted-line"
/>

<line
  x1="355"

<line
  x1="145"

<line

<!-- HOUSE NUMBERS -->
<g *ngFor="let zodiac of zodiacNumbers; let i = index">

  <text
    [attr.x]="zodiacLabelPositions[i + 1].x"
    [attr.y]="zodiacLabelPositions[i + 1].y"
    class="house-label"
  >
    {{ zodiac }}
  </text>

</g>

<g *ngFor="let house of houses">

  <ng-container
    *ngFor="let planet of housePlanets[house]; let i = index"
  >

    <text
      [attr.x]="getPlanetX(house, i)"
      [attr.y]="getPlanetY(house, i)"
      class="planet-text"
      [ngClass]="getPlanetToneClass(planet)"
    >
      <title>{{ getPlanetTooltip(planet) }}</title>
      {{ getPlanetShortName(planet) }}
    </text>

  </ng-container>

</g>



  </svg>
