<div class="south-chart-wrapper">
  <div class="south-chart" aria-label="South Indian kundali chart">
    <button
      type="button"
      class="chart-cell"
      *ngFor="let cell of cells"
      [style.grid-row]="cell.row"
      [style.grid-column]="cell.col"
      [class.active]="hoveredHouse === getHouseForSign(cell.sign)"
      [class.selected]="selectedHouse === getHouseForSign(cell.sign)"
      [attr.aria-label]="('chart.houseAriaLabel' | transloco: {
        houseNumber: getHouseForSign(cell.sign),
        label: cell.label
      })"
      (mouseenter)="hoverHouse(getHouseForSign(cell.sign))"
      (mouseleave)="leaveHouse()"
      (click)="selectHouse(getHouseForSign(cell.sign))"
    >
      <span class="sign-number">{{ cell.sign }}</span>
      <span class="house-label">H{{ getHouseForSign(cell.sign) }}</span>
      <span class="planet-list">
        <span
          class="planet-token"
          *ngFor="let planet of getPlanets(cell.sign)"
          [ngClass]="getPlanetToneClass(planet)"
          [attr.title]="getPlanetTooltip(planet)">
          {{ getPlanetShortName(planet) }}<span
            class="planet-degree"
            *ngIf="showDegrees && getPlanetDegreeLabel(planet)"
          > {{ getPlanetDegreeLabel(planet) }}°</span>
        </span>
      </span>
    </button>

    <div class="chart-center">
      <span>{{ 'chartTypes.southIndian' | transloco }}</span>
      <strong>{{ 'chart.rashiChart' | transloco }}</strong>
    </div>
  </div>
</div>
