<!-- Application Root -->
 <div class="android-splash" *ngIf="showAndroidSplash()">
  <img src="assets/splash.png" alt="HoraLife" />
</div>
<div class="root-shell" [class.public-shell]="isPublicLanding">
  <header class="app-topbar" [class.hidden]="!showAppTopbar">
    <button
      type="button"
      class="mobile-menu-toggle"
      *ngIf="showAppMenuToggle"
      (click)="toggleAppMenu()"
      aria-label="Open menu"
      title="Open menu">
      <span></span>
    </button>
    <div class="app-brand" aria-label="HoraLife">
      <app-brand-logo variant="iconText" tone="auto"></app-brand-logo>
    </div>

    <div class="language-switcher topbar-control" *ngIf="showPublicPreferenceControls" aria-label="Select language">
      <button
        type="button"
        *ngFor="let language of languages"
        [class.active]="activeLanguage === language.code"
        (click)="changeLanguage(language.code)"
      >{{ language.label }}</button>
    </div>

    <div class="theme-selector topbar-control" *ngIf="showThemeSelector" aria-label="Select theme">
      <span class="theme-mode-label">{{ themeToggleLabel }}</span>
      <button
        type="button"
        class="theme-toggle-button"
        (click)="toggleTheme()"
        [title]="themeToggleTitle"
        [attr.aria-label]="themeToggleTitle"
      >{{ themeToggleIcon }}</button>
    </div>

    <div class="topbar-right" *ngIf="showUserMenu" [class.menu-open]="isUserMenuOpen">
      <div
        class="user-menu"
        role="button"
        tabindex="0"
        (click)="toggleUserMenu()"
        (keydown.enter)="toggleUserMenu()"
        (keydown.space)="handleUserMenuSpace($event)"
        [class.open]="isUserMenuOpen"
        [attr.aria-expanded]="isUserMenuOpen"
        aria-haspopup="menu"
        aria-controls="account-menu"
        aria-label="Open user menu">
        <div class="user-avatar" aria-hidden="true">
          {{ userInitial }}
        </div>

        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <small>{{ userEmail }}</small>
        </div>

        <span class="chevron" aria-hidden="true"></span>
      </div>

      <!-- <div class="user-dropdown" id="account-menu" role="menu" *ngIf="isUserMenuOpen">
        <div class="dropdown-header">
          <div class="dropdown-avatar" aria-hidden="true">{{ userInitial }}</div>
          <div>
            <strong>{{ userName }}</strong>
            <small>{{ userEmail }}</small>
          </div>
        </div>

        <button type="button" role="menuitem" routerLink="/profile" (click)="closeUserMenu()">

        <div class="dropdown-divider"></div>

        <button type="button" role="menuitem" class="logout" (click)="logout()">

        </button>

<div
  class="user-dropdown"
  id="account-menu"
  role="menu"
  *ngIf="isUserMenuOpen"
>
  <!-- <div class="dropdown-header">
    <div class="dropdown-avatar" aria-hidden="true">
      {{ userInitial }}
    </div>

    <div class="dropdown-user-info">
      <strong>{{ userName }}</strong>
      <small>{{ userEmail }}</small>
    </div>
  </div> -->

  <!-- My Profile -->
  <button
    type="button"
    role="menuitem"
    routerLink="/profile"
    (click)="closeUserMenu()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <circle cx="12" cy="8" r="3"></circle>
      <path d="M5.5 20v-1.5A5.5 5.5 0 0 1 11 13h2a5.5 5.5 0 0 1 5.5 5.5V20"></path>
    </svg>

    <span>My Profile</span>
  </button>

  <!-- Settings -->
  <button
    type="button"
    role="menuitem"
    routerLink="/settings"
    (click)="closeUserMenu()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="3"></circle>
      <path
        d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V20.3h-3v-.08a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.04H5.3v-3h.14A1.7 1.7 0 0 0 7 9.92a1.7 1.7 0 0 0-.34-1.88L6.6 7.98l2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.7 4.7v-.1h3v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.04h.14v3h-.14A1.7 1.7 0 0 0 19.4 15Z"
      ></path>
    </svg>

    <span>Settings</span>
  </button>

  <!-- Change Password -->
  <button
    type="button"
    role="menuitem"
    routerLink="/app/change-password"
    (click)="closeUserMenu()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <rect x="5" y="10" width="14" height="10" rx="2"></rect>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      <circle cx="12" cy="15" r="1"></circle>
      <path d="M12 16v1.5"></path>
    </svg>

    <span>Change Password</span>
  </button>

  <!-- White-label Settings -->
  <button
    type="button"
    role="menuitem"
    routerLink="/app/white-label-settings"
    (click)="closeUserMenu()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H13l7 7-8.5 8.5a2 2 0 0 1-2.8 0l-4.2-4.2a2 2 0 0 1 0-2.8L13 4"></path>
      <circle cx="9" cy="9" r="1.5"></circle>
    </svg>

    <span>White-label Settings</span>
  </button>
  <div class="dropdown-divider dropdown-divider--mobile" role="separator"></div>

  <section class="mobile-preferences" aria-label="Display preferences">
    <div class="mobile-preference-group">
      <span class="mobile-preference-title">Language</span>
      <div class="mobile-option-list mobile-option-list--language">
        <button
          type="button"
          *ngFor="let language of languages"
          [class.active]="activeLanguage === language.code"
          (click)="changeLanguage(language.code)"
        >{{ language.label }}</button>
      </div>
    </div>

    <div class="mobile-preference-group">
      <span class="mobile-preference-title">Theme</span>
      <div class="mobile-option-list mobile-option-list--theme">
        <button
          type="button"
          *ngFor="let theme of themes"
          [class.active]="themeService.mode() === theme.mode"
          (click)="themeService.setTheme(theme.mode)"
          [title]="theme.label + ' theme'"
        >
          <span>{{ theme.icon }}</span>
          <small>{{ theme.label }}</small>
        </button>
      </div>
    </div>
  </section>

  <div class="dropdown-divider" role="separator"></div>

  <!-- Logout -->
  <button
    type="button"
    role="menuitem"
    class="logout"
    (click)="logout()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"></path>
      <path d="M14 8l4 4-4 4"></path>
      <path d="M9 12h9"></path>
    </svg>

    <span>Logout</span>
  </button>
</div>
      
    </div>
  </header>

  <main class="page-content" [class.public-page-content]="isPublicLanding">
    <router-outlet></router-outlet>
  </main>
  <app-notification-toast></app-notification-toast>
</div>
