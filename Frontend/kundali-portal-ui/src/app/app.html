<!-- Application Root -->
<div class="root-shell" [class.public-shell]="isPublicLanding" [class.auth-shell]="isAuthPage">
  <header class="app-topbar" [class.hidden]="!showAppTopbar">
    <button
      type="button"
      class="mobile-menu-toggle"
      *ngIf="showAppMenuToggle"
      (click)="toggleAppMenu()"
      aria-label="Open menu"
      title="Open menu">
      <span></span>
    </button>
    <div class="app-brand" aria-label="HoraLife">
      <app-brand-logo variant="iconText"></app-brand-logo>
    </div>

    <div class="topbar-right" *ngIf="showUserMenu" [class.menu-open]="isUserMenuOpen">
      <app-notification-center></app-notification-center>
      <button
        type="button"
        class="sketch-toggle"
        [class.active]="isGlobalSketchOpen"
        [attr.aria-pressed]="isGlobalSketchOpen"
        [attr.aria-label]="isGlobalSketchOpen ? 'Close sketch tool' : 'Open sketch tool'"
        [title]="isGlobalSketchOpen ? 'Close sketch tool' : 'Open sketch tool'"
        (click)="toggleGlobalSketch()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3.8a1.6 1.6 0 0 1 2.3 0l2.7 2.7a1.6 1.6 0 0 1 0 2.3L10.1 18.9 5 20l1.1-5.1z"></path><path d="m13.8 5.2 5 5"></path></svg>
      </button>
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="themeToggleTitle"
        [title]="themeToggleTitle">
        {{ themeToggleIcon }}
      </button>
      <label class="topbar-language">
        <span class="sr-only">Language</span>
        <select
          [value]="activeLanguage"
          (change)="changeLanguage($any($event.target).value)"
          aria-label="Language">
          <option *ngFor="let language of languages" [value]="language.code">{{ language.label }}</option>
        </select>
      </label>
      <div
        class="user-menu"
        role="button"
        tabindex="0"
        (click)="toggleUserMenu()"
        (keydown.enter)="toggleUserMenu()"
        (keydown.space)="handleUserMenuSpace($event)"
        [class.open]="isUserMenuOpen"
        [attr.aria-expanded]="isUserMenuOpen"
        aria-haspopup="menu"
        aria-controls="account-menu"
        aria-label="Open user menu">
        <div class="user-avatar" [class.has-photo]="!!profileImageUrl && profileImageFailedUrl !== profileImageUrl" aria-hidden="true">
          <img
            *ngIf="profileImageUrl && profileImageFailedUrl !== profileImageUrl"
            [src]="profileImageUrl"
            alt=""
            referrerpolicy="no-referrer"
            (error)="profileImageFailedUrl = profileImageUrl" />
          <span *ngIf="!profileImageUrl || profileImageFailedUrl === profileImageUrl">{{ userInitial }}</span>
        </div>

        <div class="user-info">
          <div class="user-name-row">
            <span class="user-name" [attr.data-plan]="planCode">{{ userName }}</span>
            <span class="user-admin-tag" *ngIf="isAdminUser">Admin</span>
            <span class="user-plan-mark" *ngIf="planCode !== 'Free'" [attr.data-plan]="planCode">
              <span class="user-plan-star" aria-hidden="true"></span>
              {{ planCode === 'PremiumPlus' ? 'Plus' : 'Premium' }}
            </span>
          </div>
        </div>

        <span class="chevron" aria-hidden="true"></span>
      </div>

      <!-- <div class="user-dropdown" id="account-menu" role="menu" *ngIf="isUserMenuOpen">
        <div class="dropdown-header">
          <div class="dropdown-avatar" aria-hidden="true">{{ userInitial }}</div>
          <div>
            <strong>{{ userName }}</strong>
            <small>{{ userEmail }}</small>
          </div>
        </div>

        </button>

        <button type="button" role="menuitem" routerLink="/settings" (click)="closeUserMenu()">

        <button type="button" role="menuitem" routerLink="/app/change-password" (click)="closeUserMenu()">

        <div class="dropdown-divider"></div>

        <button type="button" role="menuitem" class="logout" (click)="logout()">

        </button>

<div
  class="user-dropdown"
  id="account-menu"
  role="menu"
  *ngIf="isUserMenuOpen"
>
  <div class="dropdown-account">
    <small>{{ userEmail }}</small>
    <div class="dropdown-plan-row">
      <div class="dropdown-plan-tags">
        <span class="user-admin-tag" *ngIf="isAdminUser">Admin</span>
        <app-plan-chip variant="toolbar"></app-plan-chip>
      </div>
      <span class="user-plan-fee" [attr.data-plan]="planCode">{{ planFee }}</span>
    </div>
  </div>

  <!-- <div class="dropdown-header">
    <div class="dropdown-avatar" aria-hidden="true">
      {{ userInitial }}
    </div>

    <div class="dropdown-user-info">
      <strong>{{ userName }}</strong>
      <small>{{ userEmail }}</small>
    </div>
  </div> -->

  <!-- My Profile -->
  <button
    type="button"
    role="menuitem"
    routerLink="/app/profile"
    (click)="closeUserMenu()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <circle cx="12" cy="8" r="3"></circle>
      <path d="M5.5 20v-1.5A5.5 5.5 0 0 1 11 13h2a5.5 5.5 0 0 1 5.5 5.5V20"></path>
    </svg>

    <span>My Profile</span>
  </button>

  <!-- Settings -->
  <button
    type="button"
    role="menuitem"
    routerLink="/app/white-label-settings"
    (click)="closeUserMenu()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="3"></circle>
      <path
        d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.56V20.3h-3v-.08a1.7 1.7 0 0 0-1.04-1.56 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.56-1.04H5.3v-3h.14A1.7 1.7 0 0 0 7 9.92a1.7 1.7 0 0 0-.34-1.88L6.6 7.98l2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34A1.7 1.7 0 0 0 11.7 4.7v-.1h3v.1a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56 1.04h.14v3h-.14A1.7 1.7 0 0 0 19.4 15Z"
      ></path>
    </svg>

    <span>Settings</span>
  </button>

  <!-- Change Password -->
  <button
    type="button"
    role="menuitem"
    routerLink="/app/change-password"
    (click)="closeUserMenu()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <rect x="5" y="10" width="14" height="10" rx="2"></rect>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      <circle cx="12" cy="15" r="1"></circle>
      <path d="M12 16v1.5"></path>
    </svg>

    <span>Change Password</span>
  </button>

  <button
    type="button"
    role="menuitem"
    (click)="openPlans()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="M12 3l2.4 4.9 5.4.8-3.9 3.8.9 5.4L12 15.9 7.2 18.9l.9-5.4L4.2 9.7l5.4-.8L12 3z"></path>
    </svg>
    <span>{{ isPlusUser ? 'Manage plan' : 'Upgrade plan' }}</span>
  </button>

  <!-- White-label Settings -->
  <button
    type="button"
    role="menuitem"
    *ngIf="isPlusUser"
    routerLink="/app/white-label-settings"
    (click)="closeUserMenu()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H13l7 7-8.5 8.5a2 2 0 0 1-2.8 0l-4.2-4.2a2 2 0 0 1 0-2.8L13 4"></path>
      <circle cx="9" cy="9" r="1.5"></circle>
    </svg>

    <span>White-label Settings</span>
  </button>
  <!-- Logout -->
  <button
    type="button"
    role="menuitem"
    class="logout"
    (click)="logout()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path d="M10 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h4"></path>
      <path d="M14 8l4 4-4 4"></path>
      <path d="M9 12h9"></path>
    </svg>

    <span>Logout</span>
  </button>
</div>
      
    </div>
  </header>

  <app-global-sketch-overlay *ngIf="isGlobalSketchOpen"></app-global-sketch-overlay>

  <main class="page-content" [class.public-page-content]="isPublicLanding">
    <router-outlet></router-outlet>
  </main>
  <app-notification-toast></app-notification-toast>
  <app-subscription-modal></app-subscription-modal>
  <app-confirm-dialog></app-confirm-dialog>
</div>
