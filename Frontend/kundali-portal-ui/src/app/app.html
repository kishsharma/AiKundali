<!-- Application Root -->
<div class="root-shell" [class.public-shell]="isPublicLanding">
  <header class="app-topbar" [class.hidden]="!showAppTopbar">
    <button
      type="button"
      class="mobile-menu-toggle"
      *ngIf="showAppTopbar"
      (click)="toggleAppMenu()"
      aria-label="Open menu"
      title="Open menu">
      <span></span>
    </button>
    <div class="app-brand" aria-label="HoraLife">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true" fill="none">
        <path class="mark-outline" d="M20 2 L38 20 L20 38 L2 20 Z" />
        <path class="mark-lines" d="M20 2 L38 20 M38 20 L20 38 M20 38 L2 20 M2 20 L20 2" />
        <circle class="mark-core" cx="20" cy="20" r="2.4" />
      </svg>

      <div class="brand-copy">
        <h1><span class="brand-hora">Hora</span><span class="brand-score">Life</span></h1>
        <small>Explainable Vedic Astrology</small>
      </div>
    </div>

    <div class="language-switcher" aria-label="Select language">
      <button type="button" [class.active]="activeLanguage === 'en'" (click)="changeLanguage('en')">English</button>
      <button type="button" [class.active]="activeLanguage === 'hi'" (click)="changeLanguage('hi')">&#2361;&#2367;&#2306;&#2342;&#2368;</button>
      <button type="button" [class.active]="activeLanguage === 'kn'" (click)="changeLanguage('kn')">&#3221;&#3240;&#3277;&#3240;&#3233;</button>
    </div>

    <div class="theme-selector" aria-label="Select theme">
      <button type="button" [class.active]="themeService.mode() === 'dark'" (click)="themeService.setTheme('dark')" title="Dark theme">&#9790;</button>
      <button type="button" [class.active]="themeService.mode() === 'light'" (click)="themeService.setTheme('light')" title="Light theme">&#9728;</button>
      <button type="button" [class.active]="themeService.mode() === 'hora'" (click)="themeService.setTheme('hora')" title="Hora theme">H</button>
    </div>

    <div class="topbar-right" *ngIf="showUserMenu">
      <div
        class="user-menu"
        role="button"
        tabindex="0"
        (click)="toggleUserMenu()"
        (keydown.enter)="toggleUserMenu()"
        (keydown.space)="toggleUserMenu()"
        [class.open]="isUserMenuOpen"
        [attr.aria-expanded]="isUserMenuOpen"
        aria-haspopup="menu"
        aria-label="Open user menu">
        <div class="user-avatar">
          {{ userInitial }}
        </div>

        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <small>{{ userEmail }}</small>
        </div>

        <span class="chevron" aria-hidden="true"></span>
      </div>

      <div class="user-dropdown" *ngIf="isUserMenuOpen">
        <div class="dropdown-header">
          <strong>{{ userName }}</strong>
          <small>{{ userEmail }}</small>
        </div>

        <button type="button" routerLink="/profile">
          My Profile
        </button>

        <button type="button" routerLink="/settings">
          Settings
        </button>

        <button type="button" routerLink="/app/change-password">
          Change Password
        </button>

        <button type="button" routerLink="/app/white-label-settings">
          White-label Settings
        </button>

        <div class="dropdown-divider"></div>

        <button type="button" class="logout" (click)="logout()">
          Logout
        </button>
      </div>
    </div>
  </header>

  <main class="page-content" [class.public-page-content]="isPublicLanding">
    <router-outlet></router-outlet>
  </main>
</div>
